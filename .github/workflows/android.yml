name: Build and Publish APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android API
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdk_manager="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$sdk_manager"
          "$sdk_manager" "platforms;android-35" "build-tools;35.0.0"

      - name: Test and compile Android app
        shell: bash
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug "-PbuildVersionCode=$GITHUB_RUN_NUMBER"

      - name: Validate fixed release key
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Missing required Actions Secret $secret_name. Release aborted. Last APK is preserved."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" \
            -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null
          echo "Verified configured signing keystore and alias; private key material stays secret."

      - name: Build fixed-key signed APK
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ORG_GRADLE_PROJECT_signingStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKeyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_signingKeyPassword: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease \
            "-PbuildVersionCode=$GITHUB_RUN_NUMBER" \
            "-PsigningStoreFile=$RUNNER_TEMP/release.jks"
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
          CERT_SHA="$("$APKSIGNER" verify --print-certs "$APK" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$CERT_SHA"
          echo "SIGNER_SHA256=$CERT_SHA" >> "$GITHUB_ENV"
          echo "### Signed APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Signer certificate SHA-256: \`$CERT_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Build versionCode: \`$GITHUB_RUN_NUMBER\`" >> "$GITHUB_STEP_SUMMARY"
          cp "$APK" my-painter-latest.apk

      - name: Publish only the newest signed APK
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Fixed signing certificate must match the preceding official release.
          expected="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" \
            --jq '.body' 2>/dev/null |
            sed -n 's/^Signer SHA256: //p' | head -n 1 || true)"
          if [[ -n "$expected" && "$expected" != "$SIGNER_SHA256" ]]; then
            echo "::error::Release certificate changed; latest APK has NOT been replaced."
            exit 1
          fi

          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --target "$GITHUB_SHA" \
              --title "My Painter 固定簽章正式版" \
              --notes "Preparing first signed release."
          fi

          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" --jq '.id')"
          staged="my-painter-staged-$GITHUB_RUN_ID.apk"
          cp my-painter-latest.apk "$staged"
          gh release upload latest "$staged"
          asset_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100")"
          new_id="$(printf '%s' "$asset_json" | jq -r --arg n "$staged" \
            '.[] | select(.name == $n and .size > 0 and .state == "uploaded") | .id' | head -n 1)"
          if [[ -z "$new_id" ]]; then
            echo "::error::New APK was not successfully uploaded; preserving previous latest APK."
            exit 1
          fi

          # GitHub cannot atomically overwrite an asset. Keep the previous APK as a
          # temporary backup until the new file owns the stable download filename.
          old_ids="$(printf '%s' "$asset_json" | jq -r \
            '.[] | select(.name == "my-painter-latest.apk") | .id')"
          if [[ "$(printf '%s\n' "$old_ids" | sed '/^$/d' | wc -l)" -gt 1 ]]; then
            echo "::error::Multiple existing latest assets found; refusing destructive replacement."
            exit 1
          fi
          if [[ -n "$old_ids" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$old_ids" \
              -f name="my-painter-backup-$old_ids.apk" --silent
          fi
          if ! gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$new_id" \
              -f name="my-painter-latest.apk" --silent; then
            echo "::error::Renaming uploaded APK failed; recovering previous latest APK."
            if [[ -n "$old_ids" ]]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$old_ids" \
                -f name="my-painter-latest.apk" --silent
            fi
            exit 1
          fi

          # Confirm stable filename points to the new artifact before deletion.
          installed_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[] | select(.name == "my-painter-latest.apk") | .id')"
          if [[ "$installed_id" != "$new_id" ]]; then
            echo "::error::Latest APK confirmation failed; retaining backup and stopping cleanup."
            exit 1
          fi

          gh release edit latest --target "$GITHUB_SHA" \
            --title "My Painter 固定簽章正式版" \
            --notes "$(printf 'Commit: %s\nSigner SHA256: %s\nversionCode: %s\n' \
              "$GITHUB_SHA" "$SIGNER_SHA256" "$GITHUB_RUN_NUMBER")"

          # Once verified, delete all other APK assets, staged files and old releases.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[] | select(.name != "my-painter-latest.apk" and (.name | endswith(".apk"))) | .id' |
            while IFS= read -r id; do
              if [[ -n "$id" ]]; then
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
              fi
            done
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name != "latest") | .tag_name' |
            while IFS= read -r tag; do
              if [[ -n "$tag" ]]; then gh release delete "$tag" --yes --cleanup-tag; fi
            done

          # No PR APK artifact is uploaded. Clear preexisting ones from old CI runs.
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("my-painter-")) | .id' |
            while IFS= read -r id; do
              if [[ -n "$id" ]]; then
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
              fi
            done
          echo "### Publication verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- Latest APK: \`my-painter-latest.apk\` (only retained APK)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/latest" >> "$GITHUB_STEP_SUMMARY"
