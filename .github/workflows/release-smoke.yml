name: Verify Latest APK
on:
  pull_request:
    paths:
      - .github/workflows/release-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify published installable package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" --jq '.id' >/dev/null 2>&1; then break; fi
            echo "Waiting for initial main build..."
            sleep 10
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" --jq '.assets[] | [.name, .size] | @tsv'
          gh release download latest --pattern 'my-painter-latest.apk' --dir ./smoke-apk
          test -s ./smoke-apk/my-painter-latest.apk
          unzip -t ./smoke-apk/my-painter-latest.apk | tail -n 2
          sha256sum ./smoke-apk/my-painter-latest.apk
