name: Build and Publish APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android API
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdk_manager="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$sdk_manager"
          "$sdk_manager" "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests and debug build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug "-PbuildVersionCode=$GITHUB_RUN_NUMBER"
      - name: Prepare signing credentials
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "HAS_RELEASE_KEY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets: publishing installable DEV APK (not update-stable)."
            echo "HAS_RELEASE_KEY=false" >> "$GITHUB_ENV"
          fi
      - name: Signed release build
        if: github.event_name != 'pull_request' && env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:assembleRelease "-PbuildVersionCode=$GITHUB_RUN_NUMBER" \
            "-PsigningStoreFile=$RUNNER_TEMP/release.jks" \
            "-PsigningStorePassword=$KEYSTORE_PASSWORD" \
            "-PsigningKeyAlias=$KEY_ALIAS" \
            "-PsigningKeyPassword=$KEY_PASSWORD"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk my-painter-latest.apk
      - name: DEV APK fallback
        if: github.event_name != 'pull_request' && env.HAS_RELEASE_KEY != 'true'
        run: cp app/build/outputs/apk/debug/app-debug.apk my-painter-latest.apk
      - name: Publish latest APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --target "$GITHUB_SHA" --title "My Painter 最新版" --notes "自動發布最新版 APK。"
          fi
          # Do not use --clobber: it removes the old APK before upload is verified.
          staged="my-painter-staged-$GITHUB_RUN_ID.apk"
          cp my-painter-latest.apk "$staged"
          gh release upload latest "$staged"
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" --jq '.id')
          new_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq '.[] | select(.name | startswith("my-painter-staged-")) | .id' | tail -n 1)
          test -n "$new_id"
          old_ids=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq '.[] | select(.name == "my-painter-latest.apk") | .id')
          for asset_id in $old_ids; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$new_id" -f name="my-painter-latest.apk" --silent
          # Remove orphan staged files from interrupted older runs.
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq '.[] | select(.name | startswith("my-painter-staged-")) | .id' |
            while IFS= read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"; done
          if [[ "$HAS_RELEASE_KEY" == 'true' ]]; then
            gh release edit latest --title "My Painter 正式簽章版" --notes "Commit: $GITHUB_SHA。"
          else
            gh release edit latest --title "My Painter DEV 測試版" --notes "Commit: $GITHUB_SHA。尚未設定固定簽章 Secrets，測試 APK 無法保證跨次覆蓋更新。"
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' |
            while IFS= read -r tag; do
              if [[ "$tag" != "latest" ]]; then gh release delete "$tag" --yes --cleanup-tag; fi
            done
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("my-painter-")) | .id' |
            while IFS= read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; done
      - name: PR diagnostics (1 day retention)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: my-painter-pr-${{ github.run_id }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
